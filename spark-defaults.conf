spark.master                                k8s://https://k8s.srv.webis.de
spark.kubernetes.container.image            registry.webis.de/code-lib/public-images/webis/spark:3.5.0-py3.11
spark.kubernetes.container.image.pullPolicy Always
spark.kubernetes.namespace                  spark-jobs

# Required for cluster mode
spark.kubernetes.authenticate.driver.serviceAccountName spark

# Required for client mode (optionally with fixed ports)
# spark.driver.host               li83keq.vpn.webis.de
# spark.driver.port               2222
# spark.driver.blockManager.port  2223

# Recommended, but not required (see "Scheduling")
spark.kubernetes.driver.annotation.yunikorn.apache.org/allow-preemption "false"

# Name of the pull secret for images from the Webis registry (already deployed)
spark.kubernetes.container.image.pullSecrets webis-registry-credentials

# Parallelism
spark.dynamicAllocation.enabled                                     true
spark.dynamicAllocation.shuffleTracking.enabled                     true
spark.dynamicAllocation.maxExecutors                                120
spark.kubernetes.max.executor.failures                              240
spark.kubernetes.executor.{request|limit}.cores                     1000m

# Memory
spark.driver.memory                                                 12g
spark.executor.memory                                               2g


# Cluster mode
spark.submit.deployMode                                             cluster
spark.kubernetes.file.upload.path                                   file:///mnt/ceph/storage/data-tmp/current/li83keq/spark-upload
spark.kubernetes.driver.volumes.hostPath.cephfs.options.path        /mnt/ceph/storage/data-tmp/current/li83keq/spark-upload
spark.kubernetes.driver.volumes.hostPath.cephfs.mount.path          /mnt/ceph/storage/data-tmp/current/li83keq/spark-upload

# Mount the corpora
spark.kubernetes.driver.volumes.hostPath.corpora.options.path	    /mnt/ceph/storage/corpora/
spark.kubernetes.driver.volumes.hostPath.corpora.mount.path	        /mnt/ceph/storage/corpora/
spark.kubernetes.driver.volumes.hostPath.corpora.mount.readonly	    true
spark.kubernetes.executor.volumes.hostPath.corpora.options.path     /mnt/ceph/storage/corpora/
spark.kubernetes.executor.volumes.hostPath.corpora.mount.path	    /mnt/ceph/storage/corpora/
spark.kubernetes.executor.volumes.hostPath.corpora.mount.readonly	true

# Mount data folder
spark.kubernetes.driver.volumes.hostPath.stedata.options.path        /mnt/ceph/storage/data-tmp/current/li83keq/ste-data
spark.kubernetes.driver.volumes.hostPath.stedata.mount.path          /mnt/ceph/storage/data-tmp/current/li83keq/ste-data
spark.kubernetes.executor.volumes.hostPath.stedata.options.path      /mnt/ceph/storage/data-tmp/current/li83keq/ste-data
spark.kubernetes.executor.volumes.hostPath.stedata.mount.path        /mnt/ceph/storage/data-tmp/current/li83keq/ste-data

spark.kubernetes.driver.volumes.hostPath.thesisdata.options.path     /mnt/ceph/storage/data-in-progress/data-teaching/theses/thesis-grumbach/data
spark.kubernetes.driver.volumes.hostPath.thesisdata.mount.path       /mnt/ceph/storage/data-in-progress/data-teaching/theses/thesis-grumbach/data
spark.kubernetes.executor.volumes.hostPath.thesisdata.options.path   /mnt/ceph/storage/data-in-progress/data-teaching/theses/thesis-grumbach/data
spark.kubernetes.executor.volumes.hostPath.thesisdata.mount.path     /mnt/ceph/storage/data-in-progress/data-teaching/theses/thesis-grumbach/data

spark.kubernetes.driver.volumes.hostPath.testdata.options.path       /mnt/ceph/storage/data-tmp/current/li83keq/test-data
spark.kubernetes.driver.volumes.hostPath.testdata.mount.path         /mnt/ceph/storage/data-tmp/current/li83keq/test-data
spark.kubernetes.executor.volumes.hostPath.testdata.options.path     /mnt/ceph/storage/data-tmp/current/li83keq/test-data
spark.kubernetes.executor.volumes.hostPath.testdata.mount.path       /mnt/ceph/storage/data-tmp/current/li83keq/test-data

# Logging
# spark.driver.extraJavaOptions                                        -Dlog4j.configuration=file:/tmp/log4j.properties
# spark.executor.extraJavaOptions                                      -Dlog4j.configuration=file:/tmp/log4j.properties