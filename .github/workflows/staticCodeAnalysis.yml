##
# @author Luca-Philipp Grumbach
# @section DESCRIPTION
# Run static code analsis.
##
name: Run static code analysis
on:
    push:
      branches:
          - main
          - develop
    pull_request:
      branches:
          - main
          - develop
    workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '21'

    - name: Cache SBT
      uses: actions/cache@v4
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.coursier
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
    - name: Run scapegoat
      run: sbt scapegoat