##
# @author Luca-Philipp Grumbach
# @section DESCRIPTION
# Run static code analsis.
##
name: Run static code analysis
on:
    push:
      branches:
          - main
          - develop
    pull_request:
      branches:
          - main
          - develop
    workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '21'

    - name: Install sbt
      run: |
        echo "Installing sbt..."
        curl -L https://www.scala-sbt.org/sbt-rpm.repo | sudo tee /etc/yum.repos.d/sbt-rpm.repo
        sudo yum install sbt

    - name: Cache SBT
      uses: actions/cache@v4
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.coursier
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
    - name: Run scapegoat
      run: sbt scapegoat
    - name: Add SCA PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: ./target/scala-2.12/scapegoat-report/scapegoat.md