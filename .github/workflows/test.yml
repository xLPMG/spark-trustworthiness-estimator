##
# @author Luca-Philipp Grumbach
# @section DESCRIPTION
# Run tests and visualize the coverage report.
##
name: Run tests
on:
    push:
      branches:
          - main
          - develop
    pull_request:
      branches:
          - main
          - develop
    workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '21'

    - name: Cache SBT
      uses: actions/cache@v4
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.coursier
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
    - name: Run tests
      run: sbt coverage test
    - name: Create Coverage Report
      run: sbt coverageReport
    - name: Visualize Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: "./target/scala-2.12/coverage-report/cobertura.xml"
        badge: true
        format: markdown
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
