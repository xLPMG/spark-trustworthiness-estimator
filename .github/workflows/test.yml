##
# @author Luca-Philipp Grumbach
# @section DESCRIPTION
# Run tests and visualize the coverage report.
##
name: Run tests
on:
    push:
      branches:
          - main
          - develop
    pull_request:
      branches:
          - main
          - develop
    workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: sbt coverage test
    - name: Create Coverage Report
      run: sbt coverageReport
    - name: Visualize Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: "./target/scala-2.12/coverage-report/cobertura.xml"
        badge: true
        format: markdown
